name: Build and release plugin

# Push a tag like "v1.1.0" (on main) to trigger this. It builds the DLL,
# packages it into a versioned zip via jprm, attaches that zip to a new
# GitHub Release, and commits an updated manifest.json back to main so
# the repo's manifest.json (what people add as a Jellyfin plugin
# repository URL) picks up the new version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.1.0.0 (defaults to the pushed tag)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jprm
        run: |
          pip install --user jprm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: version
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clean stale NuGet lock files
        run: find . -name project.assets.json -delete

      - name: Build plugin zip
        id: build
        run: |
          mkdir -p artifacts
          ZIPFILE=$(jprm --verbosity=debug plugin build "Jellyfin.Plugin.ShowDirector" --output=artifacts --version="${{ steps.version.outputs.version }}")
          echo "Built $ZIPFILE"
          echo "zipfile=$ZIPFILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.build.outputs.zipfile }}

      - name: Update JPRM repository manifest
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
          jprm --verbosity=debug repo add --url="$RELEASE_URL" . "${{ steps.build.outputs.zipfile }}"


      - name: Commit updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add v${{ steps.version.outputs.version }} to plugin manifest" || echo "No manifest changes to commit"
          git push origin HEAD:main